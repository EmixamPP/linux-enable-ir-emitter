name: Build, Test, Lint & Package

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: 'Build with release profile'
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      build:
        value: ${{ jobs.build.outputs.build }}
      tests:
        value: ${{ jobs.build.outputs.tests }}
      clippy:
        value: ${{ jobs.build.outputs.clippy }}
      format:
        value: ${{ jobs.build.outputs.format }}
      doc:
        value: ${{ jobs.build.outputs.doc }}
      shear:
        value: ${{ jobs.build.outputs.shear }}
      artifact-url:
        value: ${{ jobs.build.outputs.artifact-url }}
      artifact-url-aarch64:
        value: ${{ jobs.build.outputs.artifact-url-aarch64 }}
      version:
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: Build, Test, Lint and Package
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outcome }}
      tests: ${{ steps.tests.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      format: ${{ steps.format.outcome }}
      doc: ${{ steps.doc.outcome }}
      shear: ${{ steps.shear.outcome }}
      version: ${{ steps.create-artifacts.outputs.VERSION}}
      artifact-url: ${{ steps.upload-x86.outputs.artifact-url }}
      artifact-url-aarch64: ${{ steps.upload-aarch64.outputs.artifact-url }}
    env:
      build-type: ${{ inputs.release && 'release' || 'dev' }}
      aarch64-target: aarch64-unknown-linux-gnu
      # v4l2-sys-mit generates its bindings with bindgen, which needs the aarch64 kernel headers
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu: -I/usr/aarch64-linux-gnu/include
    steps:
      - uses: actions/checkout@v6

      - name: Restore cached cargo dependencies
        id: deps-cache
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add ${{ env.aarch64-target }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          # Linting tools
          cargo install cargo-shear --locked
          cargo fetch

      - name: Build
        id: build
        if: always()
        run: cargo build --profile ${{ env.build-type }}

      - name: Build aarch64
        id: build-aarch64
        if: always()
        run: cargo build --profile ${{ env.build-type }} --target ${{ env.aarch64-target }}

      - name: Tests
        id: tests
        if: always()
        run: cargo test --profile ${{ env.build-type }}

      - name: Clippy
        id: clippy
        if: always()
        run: cargo clippy --profile ${{ env.build-type }} --no-deps -- --deny warnings

      - name: Format
        id: format
        if: always()
        run: cargo fmt -- --check

      - name: Doc
        id: doc
        if: always()
        env:
          CARGO_BUILD_RUSTDOCFLAGS: "--deny warnings"
        run: cargo doc --profile ${{ env.build-type }} --document-private-items --no-deps

      - name: Shear
        if: always()
        id: shear
        run: cargo shear

      - name: Create artifacts
        id: create-artifacts
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          version=$(cargo pkgid | sed 's/.*#//')
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ env.build-type }}" == "release" ]; then
            buildtype="release"
          else
            buildtype="debug"
          fi

          artifact_x86=linux-enable-ir-emitter-${version}-${buildtype}-x86-64.tar.gz
          echo "ARTIFACT_X86=$artifact_x86" >> "$GITHUB_OUTPUT"
          tar -czvf ${artifact_x86} -C target/${buildtype} linux-enable-ir-emitter

          if [ "${{ steps.build-aarch64.outcome }}" == "success" ]; then
            artifact_aarch64=linux-enable-ir-emitter-${version}-${buildtype}-aarch64.tar.gz
            echo "ARTIFACT_AARCH64=$artifact_aarch64" >> "$GITHUB_OUTPUT"
            tar -czvf ${artifact_aarch64} -C target/${{ env.aarch64-target }}/${buildtype} linux-enable-ir-emitter
          fi

      - name: Upload x86
        id: upload-x86
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create-artifacts.outputs.ARTIFACT_X86 }}
          path: ${{ steps.create-artifacts.outputs.ARTIFACT_X86 }}
          if-no-files-found: error
          archive: false

      - name: Upload aarch64
        id: upload-aarch64
        if: ${{ steps.build.outcome == 'success' && steps.build-aarch64.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.create-artifacts.outputs.ARTIFACT_AARCH64 }}
          path: ${{ steps.create-artifacts.outputs.ARTIFACT_AARCH64 }}
          if-no-files-found: error
          archive: false

      - name: Save cached cargo dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/
            target/
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
